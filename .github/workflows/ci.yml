name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo 'gofmt needed:'; gofmt -l .; exit 1)
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  backend-postgres:
    name: Backend (Postgres gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conf
          POSTGRES_PASSWORD: confpass
          POSTGRES_DB: conftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conf -d conftest"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: migration + RLS isolation gate (Postgres)
        env:
          TEST_DATABASE_URL: postgres://conf:confpass@localhost:5432/conftest?sslmode=disable
        # Runs the Postgres migration gate AND the fail-closed RLS isolation gate
        # (TestRLSEnforcement) — the regex must match both, else the RLS backstop
        # has zero CI coverage.
        run: go test ./internal/db/... -run 'Postgres|RLS' -count=1 -v

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
