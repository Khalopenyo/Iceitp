name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo 'gofmt needed:'; gofmt -l .; exit 1)
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  # NOTE (Фаза 2): добавить отдельную джобу `isolation-gate` на реальном Postgres
  # (services: postgres) с RLS и app-ролью без BYPASSRLS, и `-race`.
  # В Фазе 0 isolation-тест помечен t.Skip и проходит как SKIP.

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
